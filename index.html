<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f;
    --bg2: #181818;
    --bg3: #222;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f0;
    --text2: #999;
    --text3: #555;
    --green: #4ade80;
    --green-bg: rgba(74,222,128,0.1);
    --amber: #fbbf24;
    --amber-bg: rgba(251,191,36,0.1);
    --red: #f87171;
    --red-bg: rgba(248,113,113,0.1);
    --accent: #6366f1;
    --accent-bg: rgba(99,102,241,0.12);
    --radius: 12px;
    --radius-sm: 8px;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; }

  /* AUTH SCREEN */
  #auth-screen {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2rem; padding: 2rem;
  }
  .auth-logo { font-size: 13px; font-family: 'DM Mono', monospace; color: var(--text3); letter-spacing: 0.15em; text-transform: uppercase; }
  .auth-title { font-size: 32px; font-weight: 600; text-align: center; letter-spacing: -0.5px; }
  .auth-sub { font-size: 14px; color: var(--text2); text-align: center; max-width: 300px; line-height: 1.6; }
  .google-btn {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 14px 24px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
    color: var(--text); cursor: pointer; transition: all 0.2s;
  }
  .google-btn:hover { background: var(--bg3); border-color: rgba(255,255,255,0.2); }
  .google-icon { width: 20px; height: 20px; }

  /* MAIN APP */
  #app { display: none; min-height: 100vh; }

  /* TOP BAR */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.5rem; height: 56px;
  }
  .topbar-logo { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--text3); letter-spacing: 0.1em; }
  .user-row { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border2); }
  .user-name { font-size: 13px; color: var(--text2); }
  .sign-out-btn { font-size: 12px; color: var(--text3); background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm); transition: all 0.15s; }
  .sign-out-btn:hover { color: var(--text); background: var(--bg3); }

  /* TABS */
  .tab-bar {
    display: flex; gap: 2px; padding: 0 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .tab {
    padding: 12px 16px; font-size: 13px; font-weight: 500;
    color: var(--text2); background: none; border: none; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: all 0.15s; letter-spacing: 0.01em;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text); }

  /* CONTENT */
  .content { padding: 1.5rem; max-width: 720px; margin: 0 auto; }
  .section { display: none; } .section.active { display: block; }

  /* METRICS */
  .metric-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  @media(min-width: 480px) { .metric-grid { grid-template-columns: repeat(4, 1fr); } }
  .metric { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .metric-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .metric-val { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; }
  .metric-val.good { color: var(--green); } .metric-val.warn { color: var(--amber); } .metric-val.bad { color: var(--red); }

  /* CARDS */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 10px; }
  .card.today { border-color: var(--accent); }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .card-title { font-size: 14px; font-weight: 600; }
  .card-sub { font-size: 12px; color: var(--text2); }

  /* SUBJECT ROW */
  .subj-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
  .subj-time { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); min-width: 52px; }
  .subj-name { flex: 1; font-size: 13px; }
  .tick-btn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--border2); background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    transition: all 0.15s; color: var(--text2);
  }
  .tick-btn:hover { border-color: rgba(255,255,255,0.3); }
  .tick-btn.present { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .tick-btn.absent { background: var(--red-bg); border-color: var(--red); color: var(--red); }
  .tick-btn.holiday { background: var(--bg3); border-color: var(--border); color: var(--text3); font-size: 10px; font-family: 'DM Mono', monospace; }
  .upcoming-tag { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }

  /* STATS */
  .subj-stat { padding: 10px 0; border-top: 1px solid var(--border); }
  .subj-stat-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .subj-stat-name { flex: 1; font-size: 13px; font-weight: 500; }
  .subj-stat-pct { font-size: 14px; font-weight: 600; font-family: 'DM Mono', monospace; }
  .pct-good { color: var(--green); } .pct-warn { color: var(--amber); } .pct-bad { color: var(--red); }
  .progress-bar { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
  .fill-good { background: var(--green); } .fill-warn { background: var(--amber); } .fill-bad { background: var(--red); }
  .subj-stat-note { font-size: 11px; color: var(--text3); margin-top: 4px; font-family: 'DM Mono', monospace; }

  /* BADGE */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-left: 6px; }
  .badge.safe { background: var(--green-bg); color: var(--green); }
  .badge.risk { background: var(--amber-bg); color: var(--amber); }
  .badge.low { background: var(--red-bg); color: var(--red); }

  /* FORECAST BANNER */
  .banner { border-radius: var(--radius); padding: 12px 16px; margin-bottom: 1.5rem; font-size: 13px; line-height: 1.6; }
  .banner.good { background: var(--green-bg); border: 1px solid rgba(74,222,128,0.2); color: var(--green); }
  .banner.bad { background: var(--red-bg); border: 1px solid rgba(248,113,113,0.2); color: var(--red); }
  .banner strong { font-weight: 600; }

  /* WEEK NAV */
  .week-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
  .week-nav button { width: 30px; height: 30px; border: 1px solid var(--border2); border-radius: var(--radius-sm); background: none; cursor: pointer; color: var(--text); font-size: 14px; transition: all 0.15s; }
  .week-nav button:hover { background: var(--bg3); }
  .week-label { flex: 1; text-align: center; font-size: 13px; color: var(--text2); font-family: 'DM Mono', monospace; }

  /* TIMETABLE */
  .add-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .add-form select, .add-form input {
    flex: 1; min-width: 100px; height: 36px; font-size: 13px;
    background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm);
    padding: 0 10px; color: var(--text); font-family: 'DM Sans', sans-serif;
  }
  .add-form select option { background: #222; }
  .add-btn {
    height: 36px; padding: 0 16px; font-size: 13px; font-weight: 500;
    background: var(--accent); border: none; border-radius: var(--radius-sm);
    color: #fff; cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: opacity 0.15s;
  }
  .add-btn:hover { opacity: 0.85; }
  .del-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; padding: 0 4px; transition: color 0.15s; }
  .del-btn:hover { color: var(--red); }
  .section-title { font-size: 14px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
  .empty { text-align: center; padding: 2.5rem; color: var(--text3); font-size: 13px; }
  .tip { font-size: 12px; color: var(--text3); background: var(--bg3); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 1rem; line-height: 1.6; }
  .saving { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; text-align: right; padding: 4px 0; min-height: 20px; transition: opacity 0.3s; }

  /* LOADING */
  #loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; color: var(--text3); font-size: 13px; font-family: 'DM Mono', monospace; }
</style>
</head>
<body>

<div id="loading">initializing...</div>

<div id="auth-screen" style="display:none">
  <div class="auth-logo">attendance tracker</div>
  <div>
    <div class="auth-title">Track your attendance.<br/>Stay above 75%.</div>
  </div>
  <div class="auth-sub">Sign in to sync your timetable and attendance across all your devices.</div>
  <button class="google-btn" onclick="signInWithGoogle()">
    <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Continue with Google
  </button>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-logo">att / tracker</div>
    <div class="user-row">
      <img class="avatar" id="user-avatar" src="" alt="" />
      <span class="user-name" id="user-name"></span>
      <button class="sign-out-btn" onclick="signOutUser()">sign out</button>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab active" onclick="showTab('dashboard')">Dashboard</button>
    <button class="tab" onclick="showTab('mark')">Mark</button>
    <button class="tab" onclick="showTab('timetable')">Timetable</button>
  </div>
  <div class="content">
    <div class="saving" id="save-status"></div>

    <!-- DASHBOARD -->
    <div id="tab-dashboard" class="section active">
      <div class="metric-grid" id="metrics"></div>
      <div id="forecast-banner"></div>
      <div class="section-title">Subject breakdown</div>
      <div class="card" id="subject-stats"></div>
    </div>

    <!-- MARK -->
    <div id="tab-mark" class="section">
      <div class="week-nav">
        <button onclick="shiftWeek(-1)">&#8592;</button>
        <span class="week-label" id="week-label"></span>
        <button onclick="shiftWeek(1)">&#8594;</button>
      </div>
      <div id="day-cards"></div>
    </div>

    <!-- TIMETABLE -->
    <div id="tab-timetable" class="section">
      <div class="tip">Add your weekly recurring lectures. They'll appear every week automatically.</div>
      <div id="tt-list"></div>
      <div class="card">
        <div class="card-title" style="font-size:13px;margin-bottom:4px">Add lecture</div>
        <div class="add-form">
          <select id="tt-day">
            <option value="0">Monday</option><option value="1">Tuesday</option>
            <option value="2">Wednesday</option><option value="3">Thursday</option>
            <option value="4">Friday</option><option value="5">Saturday</option>
          </select>
          <input id="tt-subj" placeholder="Subject name" />
          <input id="tt-time" type="time" value="09:00" />
          <button class="add-btn" onclick="addLecture()">Add</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBdXhOKr2gMODYXRLenl6jTk1YxDYHPF34",
  authDomain: "attendance-tracker-b7e76.firebaseapp.com",
  projectId: "attendance-tracker-b7e76",
  storageBucket: "attendance-tracker-b7e76.firebasestorage.app",
  messagingSenderId: "729223593991",
  appId: "1:729223593991:web:c468cc321bfb1dd93aeaa2",
  measurementId: "G-VQCQVD7YC8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
let state = { timetable: [], attendance: {} };
let currentUser = null;
let weekOffset = 0;
let saveTimer = null;
let unsubscribe = null;

// --- AUTH ---
window.signInWithGoogle = async () => {
  const provider = new GoogleAuthProvider();
  try { await signInWithPopup(auth, provider); } catch(e) { alert('Sign-in failed: ' + e.message); }
};
window.signOutUser = async () => {
  if (unsubscribe) unsubscribe();
  await signOut(auth);
};

onAuthStateChanged(auth, async user => {
  document.getElementById('loading').style.display = 'none';
  if (user) {
    currentUser = user;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-name').textContent = user.displayName?.split(' ')[0] || 'User';
    document.getElementById('user-avatar').src = user.photoURL || '';
    listenToData();
  } else {
    currentUser = null;
    if (unsubscribe) unsubscribe();
    document.getElementById('app').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
  }
});

function listenToData() {
  const ref = doc(db, 'users', currentUser.uid, 'data', 'main');
  unsubscribe = onSnapshot(ref, snap => {
    if (snap.exists()) {
      const d = snap.data();
      state.timetable = d.timetable || [];
      state.attendance = d.attendance || {};
    } else {
      state = { timetable: [], attendance: {} };
    }
    renderAll();
  });
}

async function saveData() {
  if (!currentUser) return;
  const ref = doc(db, 'users', currentUser.uid, 'data', 'main');
  showSaving(true);
  try {
    await setDoc(ref, { timetable: state.timetable, attendance: state.attendance });
    showSaving(false);
  } catch(e) { showSaving(false, true); }
}

function showSaving(saving, err) {
  const el = document.getElementById('save-status');
  if (saving) { el.textContent = 'saving...'; el.style.opacity = '1'; }
  else if (err) { el.textContent = 'save failed'; el.style.opacity = '1'; }
  else { el.textContent = 'saved'; el.style.opacity = '1'; setTimeout(() => el.style.opacity = '0', 1500); }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 600);
}

// --- HELPERS ---
function getMondayOf(d) {
  const dd = new Date(d);
  const day = dd.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dd.setDate(dd.getDate() + diff);
  dd.setHours(0,0,0,0);
  return dd;
}
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function getWeekDates(offset) {
  const mon = getMondayOf(new Date());
  mon.setDate(mon.getDate() + offset * 7);
  return Array.from({length:6}, (_,i) => { const d = new Date(mon); d.setDate(mon.getDate()+i); return d; });
}
function getLecturesForDate(d) {
  const idx = (d.getDay()+6)%7;
  return state.timetable.filter(l => parseInt(l.day)===idx).sort((a,b)=>a.time.localeCompare(b.time));
}
function attKey(dk,subj,time) { return `${dk}__${subj}__${time}`; }

function getStats() {
  const map = {};
  for (const l of state.timetable) { if (!map[l.subj]) map[l.subj]={present:0,absent:0,total:0}; }
  for (const [k,v] of Object.entries(state.attendance)) {
    if (v==='holiday') continue;
    const p = k.split('__'); if (p.length<3) continue;
    const s = p[1];
    if (!map[s]) map[s]={present:0,absent:0,total:0};
    map[s].total++;
    if (v==='present') map[s].present++;
    else map[s].absent++;
  }
  return map;
}

function calcForecast(present, total) {
  if (total===0) return null;
  const pct = present/total*100;
  if (pct>=75) {
    let canSkip=0;
    while((present/(total+canSkip+1)*100)>=75) canSkip++;
    return {ok:true, canSkip};
  } else {
    for (let need=1; need<=500; need++) {
      if ((present+need)/(total+need)*100>=75) return {ok:false,need};
    }
    return {ok:false,need:null};
  }
}

function pctClass(p) { return p>=75?'good':p>=60?'warn':'bad'; }
function fillClass(p) { return p>=75?'fill-good':p>=60?'fill-warn':'fill-bad'; }

// --- RENDER ---
function renderAll() { renderDashboard(); renderMark(); renderTimetable(); }

function renderDashboard() {
  const stats = getStats();
  const subjects = Object.keys(stats);
  let tp=0, tc=0;
  for (const s of subjects) { tp+=stats[s].present; tc+=stats[s].total; }
  const pct = tc>0 ? tp/tc*100 : 0;
  const cls = pctClass(pct);

  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-label">Attendance</div><div class="metric-val ${cls}">${tc>0?pct.toFixed(1)+'%':'—'}</div></div>
    <div class="metric"><div class="metric-label">Attended</div><div class="metric-val">${tp}</div></div>
    <div class="metric"><div class="metric-label">Total</div><div class="metric-val">${tc}</div></div>
    <div class="metric"><div class="metric-label">Missed</div><div class="metric-val">${tc-tp}</div></div>
  `;

  const fc = tc>0 ? calcForecast(tp,tc) : null;
  const fEl = document.getElementById('forecast-banner');
  if (fc) {
    if (fc.ok) fEl.innerHTML = `<div class="banner good">You can skip <strong>${fc.canSkip}</strong> more ${fc.canSkip===1?'class':'classes'} and still stay above 75%.</div>`;
    else if (fc.need) fEl.innerHTML = `<div class="banner bad">Attend the next <strong>${fc.need}</strong> consecutive ${fc.need===1?'class':'classes'} to reach 75%.</div>`;
    else fEl.innerHTML = `<div class="banner bad">Cannot reach 75% even attending all remaining classes. Focus on individual subjects.</div>`;
  } else { fEl.innerHTML = ''; }

  const sEl = document.getElementById('subject-stats');
  if (!subjects.length) { sEl.innerHTML = '<div class="empty">No subjects yet. Add them in Timetable.</div>'; return; }
  sEl.innerHTML = subjects.map(s => {
    const d = stats[s];
    const p = d.total>0 ? d.present/d.total*100 : 0;
    const fc2 = d.total>0 ? calcForecast(d.present,d.total) : null;
    let badge='', note='';
    if (fc2) {
      if (fc2.ok) { badge=`<span class="badge safe">safe</span>`; note=`can skip ${fc2.canSkip} more`; }
      else if (fc2.need) { badge=`<span class="badge ${p<60?'low':'risk'}">${p<60?'low':'at risk'}</span>`; note=`need ${fc2.need} more for 75%`; }
      else { badge=`<span class="badge low">low</span>`; note=`attend all remaining`; }
    }
    return `<div class="subj-stat">
      <div class="subj-stat-top">
        <span class="subj-stat-name">${s}${badge}</span>
        <span class="subj-stat-pct pct-${pctClass(p)}">${d.total>0?p.toFixed(1)+'%':'—'}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill ${fillClass(p)}" style="width:${Math.min(p,100).toFixed(1)}%"></div></div>
      <div class="subj-stat-note">${d.present}/${d.total} classes &nbsp;·&nbsp; ${note}</div>
    </div>`;
  }).join('');
}

function renderMark() {
  const dates = getWeekDates(weekOffset);
  const mon=dates[0], fri=dates[dates.length-1];
  const fmt = d => d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  document.getElementById('week-label').textContent = `${fmt(mon)} – ${fmt(fri)}`;
  const today = dateKey(new Date());
  let html='';
  for (const d of dates) {
    const dk = dateKey(d);
    const lecs = getLecturesForDate(d);
    if (!lecs.length) continue;
    const isToday = dk===today;
    const isPast = dk<=today;
    const dayName = DAYS[(d.getDay()+6)%7];
    html += `<div class="card ${isToday?'today':''}">
      <div class="card-header">
        <span class="card-title">${dayName}${isToday?' <span style="font-size:10px;background:rgba(99,102,241,0.2);color:#a5b4fc;padding:2px 8px;border-radius:99px;font-weight:500">today</span>':''}</span>
        <span class="card-sub">${d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span>
      </div>`;
    for (const lec of lecs) {
      const ak = attKey(dk, lec.subj, lec.time);
      const val = state.attendance[ak]||'none';
      html += `<div class="subj-row">
        <span class="subj-time">${lec.time}</span>
        <span class="subj-name">${lec.subj}</span>
        ${isPast ? `
          <button class="tick-btn ${val==='present'?'present':''}" data-ak="${ak}" data-v="present" title="Present">&#10003;</button>
          <button class="tick-btn ${val==='absent'?'absent':''}" data-ak="${ak}" data-v="absent" title="Absent">&#10005;</button>
          <button class="tick-btn holiday ${val==='holiday'?'holiday':''}" data-ak="${ak}" data-v="holiday" title="Holiday">H</button>
        ` : `<span class="upcoming-tag">upcoming</span>`}
      </div>`;
    }
    html += '</div>';
  }
  if (!html) html = '<div class="empty">No lectures this week. Add subjects in Timetable.</div>';
  document.getElementById('day-cards').innerHTML = html;
  document.getElementById('day-cards').querySelectorAll('.tick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const ak = btn.dataset.ak, v = btn.dataset.v;
      if (state.attendance[ak]===v) delete state.attendance[ak];
      else state.attendance[ak]=v;
      scheduleSave();
      renderMark();
      renderDashboard();
    });
  });
}

function renderTimetable() {
  const byDay = {};
  for (const l of state.timetable) {
    if (!byDay[l.day]) byDay[l.day]=[];
    byDay[l.day].push(l);
  }
  let html='<div class="card" style="padding:0.75rem 1.25rem">';
  for (let i=0;i<6;i++) {
    const lecs=(byDay[i]||[]).sort((a,b)=>a.time.localeCompare(b.time));
    const chips = lecs.length ? lecs.map(l=>{
      const ds = l.subj.replace(/'/g,"&#39;");
      return `<span style="display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border2);border-radius:99px;padding:3px 8px 3px 10px;font-size:12px"><span style="font-family:'DM Mono',monospace;color:var(--text3);font-size:10px">${l.time}</span><span>${ds}</span><button class="del-btn" data-id="${l.id}" style="font-size:14px;margin-left:1px;line-height:1">&#215;</button></span>`;
    }).join('') : `<span style="font-size:12px;color:var(--text3)">—</span>`;
    html+=`<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;${i>0?'border-top:1px solid var(--border)':''}"><span style="font-size:11px;font-family:'DM Mono',monospace;color:var(--text3);min-width:28px;padding-top:5px">${DAYS[i].slice(0,3)}</span><div style="display:flex;flex-wrap:wrap;gap:6px;flex:1">${chips}</div></div>`;
  }
  html+='</div>';
  if (!state.timetable.length) html='<div class="card"><div class="empty">No lectures added yet.</div></div>';
  document.getElementById('tt-list').innerHTML = html;
  document.getElementById('tt-list').querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.timetable = state.timetable.filter(l=>l.id!==btn.dataset.id);
      scheduleSave();
      renderAll();
    });
  });
}

// --- ACTIONS ---
window.addLecture = () => {
  const day = document.getElementById('tt-day').value;
  const subj = document.getElementById('tt-subj').value.trim();
  const time = document.getElementById('tt-time').value;
  if (!subj) { document.getElementById('tt-subj').focus(); return; }
  state.timetable.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), day, subj, time });
  document.getElementById('tt-subj').value='';
  scheduleSave();
  renderAll();
};
window.shiftWeek = d => { weekOffset+=d; renderMark(); };
window.showTab = name => {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['dashboard','mark','timetable'][i]===name));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
};
</script>
</body>
</html>
